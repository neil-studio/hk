    function initPresentationMaps(projects) {
      // 1. 初始化全局地图 (Overview Map)
      try {
        const overviewContainer = document.getElementById('overview-map');
        if (overviewContainer && projects.length > 0) {
          const mapOverview = L.map('overview-map', { zoomControl: false, attributionControl: false });
          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2agc_1_eee20b45a89c95d86e5610c5', {
            maxZoom: 18
          }).addTo(mapOverview);

          const group = [];
          const landmarksData = Array.isArray(window.allLandmarksData) ? window.allLandmarksData : [];
          const distFn = window.getDistMeters || function(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
          };

          const nearbyPOIsMap = new Map();

          // 收集各推荐项目周边 1.5km 范围内的港铁站、高能级地标商场与重点学校
          projects.forEach(p => {
            if (!p.lat || !p.lng) return;
            landmarksData.forEach(lm => {
            if (!lm.lat || !lm.lng) return;
            const cat = lm.category;
            if (cat === 'mtr' || cat === 'shopping_mall' || cat === 'school' || cat === 'famous_school' || cat === 'university') {
              const d = distFn(p.lat, p.lng, lm.lat, lm.lng);
              if (d <= 1500) {
                const key = lm.name;
                if (!nearbyPOIsMap.has(key) || nearbyPOIsMap.get(key).dist > d) {
                  const normCat = (cat === 'famous_school' || cat === 'university') ? 'school' : cat;
                  nearbyPOIsMap.set(key, {
                    name: lm.name,
                    category: normCat,
                    lat: lm.lat,
                    lng: lm.lng,
                    dist: d
                  });
                }
              }
            }
          });
        });

        // 1. 先绘制 1.5km 配套微型圆标标记点 (无文字标签，纯圆标展示，防止密集遮挡)
        nearbyPOIsMap.forEach(poi => {
          const cleanName = poi.name.replace(/\s*\([^)]*\)/g, '').trim();

          if (poi.category === 'mtr') {
            const mtrIcon = L.divIcon({
              className: 'overview-round-pin',
              html: `
                <div style="width:18px; height:18px; border-radius:50%; background:#C41230; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(196,18,48,0.45); border:1.5px solid #fff;" title="${cleanName}站">
                  <svg viewBox="0 0 24 24" width="11" height="11" fill="#fff" style="display:block;">
                    <path d="M11.987 1.913c-1.9 0-3.693.321-5.298.883C2.756 4.268 0 7.826 0 12c0 4.147 2.756 7.706 6.689 9.204 1.632.562 3.425.883 5.325.883a16.74 16.74 0 0 0 5.27-.856C21.217 19.759 24 16.174 24 12.027V12c0-4.174-2.783-7.732-6.716-9.204a16.295 16.295 0 0 0-5.297-.883zM10.89 5.257h2.167v3.827c1.525-.402 2.702-1.766 2.782-3.399l2.168.027c-.16 2.73-2.22 4.95-4.897 5.378v1.793c2.676.428 4.736 2.675 4.924 5.404l-2.167.028c-.08-1.633-1.258-2.997-2.783-3.425v3.853h-2.167V14.89a3.775 3.775 0 0 0-2.81 3.425l-2.167-.028a5.868 5.868 0 0 1 4.923-5.404v-1.766C8.187 10.716 6.1 8.468 5.94 5.74l2.167-.027A3.711 3.711 0 0 0 10.89 9.11Z"/>
                  </svg>
                </div>
              `,
              iconSize: [18, 18],
              iconAnchor: [9, 9]
            });
            L.marker([poi.lat, poi.lng], { icon: mtrIcon, zIndexOffset: 250 }).addTo(mapOverview);
            group.push([poi.lat, poi.lng]);
          } else if (poi.category === 'shopping_mall') {
            const mallIcon = L.divIcon({
              className: 'overview-round-pin',
              html: `
                <div style="width:18px; height:18px; border-radius:50%; background:#EA580C; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(234,88,12,0.45); border:1.5px solid #fff;" title="${cleanName}">
                  <svg viewBox="0 0 24 24" width="10" height="10" fill="#fff" style="display:block;">
                    <path d="M16 6V4a4 4 0 0 0-8 0v2H4a1 1 0 0 0-1 1v13a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a1 1 0 0 0-1-1h-4ZM10 4a2 2 0 0 1 4 0v2h-4V4Zm9 16H5V8h3v2a1 1 0 0 0 2 0V8h4v2a1 1 0 0 0 2 0V8h3v12Z"/>
                  </svg>
                </div>
              `,
              iconSize: [18, 18],
              iconAnchor: [9, 9]
            });
            L.marker([poi.lat, poi.lng], { icon: mallIcon, zIndexOffset: 240 }).addTo(mapOverview);
            group.push([poi.lat, poi.lng]);
          } else if (poi.category === 'school') {
            const schoolIcon = L.divIcon({
              className: 'overview-round-pin',
              html: `
                <div style="width:18px; height:18px; border-radius:50%; background:#0284C7; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(2,132,199,0.45); border:1.5px solid #fff;" title="${cleanName}">
                  <svg viewBox="0 0 24 24" width="10" height="10" fill="#fff" style="display:block;">
                    <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/>
                  </svg>
                </div>
              `,
              iconSize: [18, 18],
              iconAnchor: [9, 9]
            });
            L.marker([poi.lat, poi.lng], { icon: schoolIcon, zIndexOffset: 230 }).addTo(mapOverview);
            group.push([poi.lat, poi.lng]);
          }
        });

        // 2. 绘制推荐楼盘 Marker (智能防重叠错位堆叠，顶层高亮绿色 zIndexOffset: 1000)
        const clusters = [];
        const assignedProj = new Set();
        projects.forEach((p1, i) => {
          if (assignedProj.has(i) || !p1.lat || !p1.lng) return;
          const currentCluster = [i];
          assignedProj.add(i);

          projects.forEach((p2, j) => {
            if (i === j || assignedProj.has(j) || !p2.lat || !p2.lng) return;
            const d = distFn(p1.lat, p1.lng, p2.lat, p2.lng);
            if (d <= 140) { // 140米内视为同地块/分期近邻楼盘
              currentCluster.push(j);
              assignedProj.add(j);
            }
          });
          clusters.push(currentCluster);
        });

        // 计算各项目的垂直错位偏移量 (offsetY)
        const projectOffsetY = new Map();
        clusters.forEach(cl => {
          if (cl.length === 1) {
            projectOffsetY.set(cl[0], 0);
          } else {
            const step = 28; // 标牌高度26px + 2px平滑间隙
            const startY = -((cl.length - 1) * step) / 2;
            cl.forEach((projIdx, k) => {
              projectOffsetY.set(projIdx, Math.round(startY + k * step));
            });
          }
        });

        projects.forEach((p, idx) => {
          if (p.lat && p.lng) {
            const offsetY = projectOffsetY.get(idx) || 0;
            const anchorY = 13 - offsetY;

            const icon = L.divIcon({
              className: 'custom-pin-print',
              html: `
                <div style="background:#16A34A; color:#fff; padding:4px 10px; border-radius:12px; font-size:11px; font-weight:800; box-shadow:0 3px 10px rgba(22,163,74,0.45); border:2px solid #fff; white-space:nowrap; display:inline-flex; align-items:center; gap:4px;">
                  <span style="background:#fff; color:#16A34A; width:16px; height:16px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:10px; font-weight:900;">${idx + 1}</span>
                  <span>${p.name}</span>
                </div>
              `,
              iconSize: [110, 26],
              iconAnchor: [55, anchorY]
            });
            L.marker([p.lat, p.lng], { icon, zIndexOffset: 1000 + (offsetY > 0 ? 10 : 0) }).addTo(mapOverview);
            group.push([p.lat, p.lng]);
          }
        });

        if (group.length > 0) {
          mapOverview.fitBounds(L.latLngBounds(group), { padding: [35, 35] });
        }

        // 强保地图容器尺寸自适应，解决跨页渲染和字体缩放时导致的视口偏差
        setTimeout(() => {
          mapOverview.invalidateSize();
          if (group.length > 0) {
            mapOverview.fitBounds(L.latLngBounds(group), { padding: [35, 35] });
          }
        }, 150);
        setTimeout(() => {
          mapOverview.invalidateSize();
          if (group.length > 0) {
            mapOverview.fitBounds(L.latLngBounds(group), { padding: [35, 35] });
          }
        }, 400);
      }
    } catch (overviewErr) {
      console.error('Error initializing overview map:', overviewErr);
    }

      // 2. 初始化各单盘微观导航地图 (Single Project Maps - 严格对齐地图网站标准规范)
      projects.forEach((p, idx) => {
        try {
          const mapDiv = document.getElementById(`proj-map-${idx}`);
          if (!mapDiv || !p.lat || !p.lng) return;

          const mapSingle = L.map(`proj-map-${idx}`, { zoomControl: false, attributionControl: false }).setView([p.lat, p.lng], 15);
          L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2agc_1_eee20b45a89c95d86e5610c5', {
            maxZoom: 19
          }).addTo(mapSingle);

          // 1. 本案楼盘标记 (优雅正上方顶置锚定 + 精致坐标定位点，绝对居顶 zIndexOffset: 3000)
          const projIcon = L.divIcon({
            className: 'custom-proj-icon',
            html: `
              <div class="proj-dot-anchor"></div>
              <div class="proj-pin-box" title="${p.name}">${p.name}</div>
            `,
            iconSize: [0, 0],
            iconAnchor: [0, 0]
          });
          L.marker([p.lat, p.lng], { icon: projIcon, zIndexOffset: 3000 }).addTo(mapSingle);

          const mtr = p.nearest_mtr;
          let mtrDist = 9999;
          if (mtr && mtr.nearest_mtr_lat && mtr.nearest_mtr_lng) {
            mtrDist = getDistMeters(p.lat, p.lng, mtr.nearest_mtr_lat, mtr.nearest_mtr_lng);
            const cName = mtr.nearest_mtr_cn || mtr.station_name_cn || '港铁';
            
            // 港铁站标记 (严格使用地图网站官方红底白标 SVG 图标)
            const mtrSvg = `
              <svg viewBox="0 0 65 52">
                <ellipse cx="33" cy="26" rx="32" ry="26" fill="#C8102E" />
                <path d="M 33,8 V 44 M 21,9 A 12,12 0 0 0 45,9 M 21,43 A 12,12 0 0 1 45,43" stroke="white" stroke-width="6" stroke-linecap="round" fill="none" />
              </svg>
            `;

            // 智能品字形错位：若极其靠近项目 (<200米)，应用 is-smart-tight 错位至左下方，完整保留文字与Logo
            const isSmartTightMtr = (mtrDist < 200);
            const mtrHtml = `
              <div class="mtr-pin ${isSmartTightMtr ? 'is-smart-tight' : ''}" title="${cName}站">
                <span class="mtr-pin-logo">${mtrSvg}</span>
                <span class="mtr-pin-text">${cName}站</span>
              </div>
            `;

            const mtrIcon = L.divIcon({
              className: 'custom-mtr-icon',
              html: mtrHtml,
              iconSize: [0, 0],
              iconAnchor: [0, 0]
            });
            L.marker([mtr.nearest_mtr_lat, mtr.nearest_mtr_lng], { icon: mtrIcon, zIndexOffset: 2500 }).addTo(mapSingle);
          }

          // 2. 绘制周边核心地标 (商场、重点学校、公园) - 优先选取最具代表性的 2~3 个，避免视觉拥挤
          const poiFn = window.getNearbyPOIs || (typeof getNearbyPOIs === 'function' ? getNearbyPOIs : null);
          const nearbyPOIsForMap = poiFn ? (poiFn(p, window.allLandmarksData || []).slice(0, 3)) : [];

          if (nearbyPOIsForMap && nearbyPOIsForMap.length > 0) {
            nearbyPOIsForMap.forEach(poi => {
              if (!poi.lat || !poi.lng) return;
              const dToProj = getDistMeters(p.lat, p.lng, poi.lat, poi.lng);
              const dToMtr = (mtr && mtr.nearest_mtr_lat) ? getDistMeters(mtr.nearest_mtr_lat, mtr.nearest_mtr_lng, poi.lat, poi.lng) : 9999;
              
              const rawName = poi.name.split('(')[0].replace(/（.*?）/g, '').trim();
              const displayName = rawName.length > 7 ? rawName.slice(0, 6) + '..' : rawName;

              let cat = poi.category;
              let pinClass = 'custom-mall-icon';
              let iconHtml = '';

              if (cat === 'school' || cat === 'university') {
                pinClass = 'custom-school-icon';
                const schoolSvg = `<svg viewBox="0 0 24 24" class="poi-white-svg"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>`;
                const isDense = (dToProj < 220 || dToMtr < 150);
                if (isDense) {
                  iconHtml = `<div class="school-dot-pin" title="${rawName}">${schoolSvg}</div>`;

                pinClass = 'custom-park-icon';
                const parkSvg = `<svg viewBox="0 0 24 24" class="poi-white-svg"><path d="M17 12h2L12 2 5.05 12H7l-3.9 6h6.92v4h3.96v-4H21z"/></svg>`;
                const isDense = (dToProj < 220 || dToMtr < 150);
                if (isDense) {
                  iconHtml = `<div class="park-dot-pin" title="${rawName}">${parkSvg}</div>`;
                } else {
                  iconHtml = `
                    <div class="park-pin" title="${rawName}">
                      <span class="park-pin-logo">${parkSvg}</span>
                      <span class="park-pin-text">${displayName}</span>
                    </div>

                }
              } else {
                // 默认商场 / shopping mall (若靠近项目 <200米，应用 is-smart-tight 错位至右下方，完整保留文字与Logo)
                pinClass = 'custom-mall-icon';
                const mallSvg = `<svg viewBox="0 0 24 24" class="poi-white-svg"><path d="M19 6h-2c0-2.76-2.24-5-5-5S7 3.24 7 6H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-7-3c1.66 0 3 1.34 3 3H9c0-1.66 1.34-3 3-3zm7 17H5V8h14v12zm-7-8c-1.66 0-3-1.34-3-3H7c0 2.76 2.24 5 5 5s5-2.24 5-5h-2c0 1.66-1.34 3-3 3z"/></svg>`;
                const isSmartTightMall = (dToProj < 200 || dToMtr < 140);
                iconHtml = `
                  <div class="mall-pin ${isSmartTightMall ? 'is-smart-tight' : ''}" title="${rawName}">
                    <span class="mall-pin-logo">${mallSvg}</span>
                    <span class="mall-pin-text">${displayName}</span>
                  </div>
                `;
              }

              const poiIcon = L.divIcon({
                className: pinClass,
                html: iconHtml,
                iconSize: [0, 0],
                iconAnchor: [0, 0]
              });
              L.marker([poi.lat, poi.lng], { icon: poiIcon, zIndexOffset: 2400 }).addTo(mapSingle);
            });
          }

          // 3. 视野与范围计算 (保证以项目为中心覆盖 1.5~2km 中观商圈尺度，彻底解决原先 maxZoom: 17 狭窄局促的问题)
          const deltaLat = 0.0075; // 纬度约 830 米
          const deltaLng = 0.0085; // 经度约 870 米
          const viewBounds = L.latLngBounds(
            [p.lat - deltaLat, p.lng - deltaLng],
            [p.lat + deltaLat, p.lng + deltaLng]
          );

          // 适度将港铁站纳入视野边界
          if (mtr && mtr.nearest_mtr_lat && mtr.nearest_mtr_lng) {
            viewBounds.extend(L.latLng(mtr.nearest_mtr_lat, mtr.nearest_mtr_lng));
          }

          mapSingle.fitBounds(viewBounds, { padding: [20, 20], maxZoom: 15.5 });

          setTimeout(() => {
            mapSingle.invalidateSize();
            mapSingle.fitBounds(viewBounds, { padding: [20, 20], maxZoom: 15.5 });
          }, 200);
          setTimeout(() => {
            mapSingle.invalidateSize();
            mapSingle.fitBounds(viewBounds, { padding: [20, 20], maxZoom: 15.5 });
          }, 600);
        } catch (mapErr) {
          console.error(`Error initializing map for project ${idx}:`, mapErr);
        }
      });
    }
  </script>
</body>
