<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销控查询专页 - 香港一手新盘一站通</title>
  <!-- 引入 Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;700;800&display=swap" rel="stylesheet">
  <!-- 引入自定义样式 -->
  <link rel="stylesheet" href="style.css?v=20260724_fresh">
  <!-- 引入全量预编译静态数据 (零延迟离线载入) -->
  <script src="data.js?v=20260724_direct"></script>
  <!-- 引入 SheetJS 用于在线解析 Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- 引入 Chart.js 用于悬浮趋势弹窗 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- 📊 Google Analytics 4 (GA4) 零延迟全量埋点 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HG6944H8MW"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-HG6944H8MW', { 'send_page_view': true });
  </script>
  <!-- 🔒 专属访问密码保护门 (lm8888) - 零延迟优先锁定 -->
  <script>
    (function() {
      var k = 'hk_site_auth_token';
      var isUnlocked = sessionStorage.getItem(k) === 'unlocked_lm8888' || localStorage.getItem(k) === 'unlocked_lm8888';
      if (isUnlocked) {
        document.documentElement.classList.add('unlocked-auth');
      } else {
        document.documentElement.classList.add('site-locked');
      }
    })();
  </script>
</head>
<body>

  <!-- 🔒 专属访问密码保护门 (Password Gate: lm8888) -->
  <div id="siteAuthOverlay" class="site-auth-overlay">
    <div class="site-auth-card">
      <div class="auth-icon">🔒</div>
      <h2>香港一手新盘一站通</h2>
      <p class="auth-subtitle">访问受限，请输入专属授权密码开启体验</p>
      <div class="auth-input-group">
        <input type="password" id="siteAuthPassword" placeholder="请输入访问密码" autocomplete="current-password" autofocus />
        <button id="siteAuthBtn">解锁进入 →</button>
      </div>
      <div id="siteAuthError" class="auth-error-msg"></div>
    </div>
  </div>


  <!-- 背景环境光效果 -->
  <div class="glow-bg">
    <div class="glow-circle circle-1"></div>
    <div class="glow-circle circle-2"></div>
  </div>

  <div class="container">
    <!-- 统一页头与全局导航栏 -->
    <header class="app-header">
      <div class="logo-area">
        <a href="index.html" class="logo-link">
          <h1>香港一手新盘一站通</h1>
        </a>
        <p class="subtitle">实时抓取 • 全局检索 • 楼栋销控可视化网格预览</p>
      </div>
      
      <nav class="main-nav">
        <a href="index.html" class="nav-item">🏠 首页门户</a>
        <a href="sales.html" class="nav-item active">🏢 销控查询</a>
        <a href="analytics.html" class="nav-item">📈 历史成交分析</a>
        <a href="featured.html" class="nav-item">💎 聚焦精选盘</a>
      </nav>

      <div class="header-actions">
        <div class="update-badge" id="lastUpdatedBadge">数据载入中...</div>
      </div>
    </header>

    <!-- 全局统计仪表盘 -->
    <section class="dashboard-stats" id="globalStats">
      <div class="stat-card">
        <div class="stat-value" id="statProjects">-</div>
        <div class="stat-label">收录项目</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="statUnits">-</div>
        <div class="stat-label">总规划套数</div>
      </div>
      <div class="stat-card highlight-sold">
        <div class="stat-value" id="statSoldRate">-%</div>
        <div class="stat-label">整体去化率 (已售占比)</div>
      </div>
      <div class="stat-card highlight-sale">
        <div class="stat-value" id="statOnSale">-</div>
        <div class="stat-label">全港在售单位</div>
      </div>
    </section>

    <!-- 搜索与筛选控制面板 -->
    <section class="filter-panel">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索楼盘名称、地区或商圈 (如: 启德、黄竹坑)...">
      </div>
      <div class="filter-controls">
        <div class="btn-group" id="regionFilter">
          <button class="filter-btn active" data-region="all">全部区域</button>
          <button class="filter-btn" data-region="港岛">港岛</button>
          <button class="filter-btn" data-region="九龙">九龙</button>
        </div>
        <div class="select-wrapper">
          <select id="districtFilter">
            <option value="all">所有商圈</option>
          </select>
        </div>
        <div class="select-wrapper">
          <select id="sortFilter">
            <option value="default">默认排序</option>
            <option value="rate-desc">去化率从高到低</option>
            <option value="rate-asc">去化率从低到高</option>
            <option value="units-desc">规划套数最多</option>
            <option value="sale-desc">在售套数最多</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 项目列表网格容器 -->
    <main class="project-grid" id="projectGrid">
      <!-- 骨架屏占位 -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </main>
  </div>

  <!-- 销控图纸 Modal -->
  <div class="modal-overlay" id="gridModal">
    <div class="modal-container">
      <header class="modal-header">
        <div class="modal-header-compact-left">
          <h2 class="modal-header-compact-title" id="modalProjectTitle">销控可视化网格图</h2>
          <div class="building-tabs" id="buildingTabs"></div>
        </div>
        <div style="display:flex; align-items:center; gap:0.6rem;">
          <div class="zoom-controls" style="margin-right:0.3rem;">
            <button class="zoom-btn" id="zoomOutBtn" title="缩小">-</button>
            <span class="zoom-val" id="zoomVal">100%</span>
            <button class="zoom-btn" id="zoomInBtn" title="放大">+</button>
            <button class="zoom-btn reset-btn" id="resetZoomBtn" title="重置 100%">↺ 重置</button>
          </div>
          <button id="openAnalyticsFromGridBtn" class="btn btn-secondary" style="font-size:0.78rem; padding:0.3rem 0.75rem;">📈 成交走势</button>
          <button class="close-btn" id="closeModalBtn" style="background:#f1f5f9; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; color:#64748b;">✕</button>
        </div>
      </header>

      <!-- 微型销量统计与操控整合栏 -->
      <div class="stats-panel-slim" id="buildingStatsPanel"></div>

      <!-- 主网格展示区域 (极大化视口空间) -->
      <div class="excel-grid-wrapper-max" id="gridDisplayArea">
        <div style="padding:2rem; text-align:center; color:#06AABD;">正在加载并解析楼栋 Excel 销控表...</div>
      </div>
    </div>
  </div>

  <!-- 页脚 -->
  <footer class="app-footer" style="margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--border-color); text-align: center; color: var(--text-secondary); font-size: 0.85rem;">
    <p>© 2026 香港一手新盘一站通 版权所有</p>
  </footer>

  <!-- 引入主程序逻辑 -->
  <script src="app.js?v=20260811_V2"></script>
</body>
</html>
