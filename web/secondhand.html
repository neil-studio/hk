    .auth-subtitle { font-size: 12.5px; color: #64748b; margin-bottom: 20px; }
    .auth-input-group { display: flex; gap: 8px; }

    let currentSource = 'ALL';
    let currentGalleryItem = null;

    function render() {
      const container = document.getElementById("listingsContainer");
      const search = document.getElementById("searchInput").value.trim().toLowerCase();
      const district = document.getElementById("districtFilter").value;
      const room = document.getElementById("roomFilter").value;
      const status = document.getElementById("statusFilter").value;
      const sort = document.getElementById("sortFilter").value;

      // 更新顶部统计与快捷栏计数
      const totalNum = mockListings.length;
      const ownNum = mockListings.filter(x => x.sourceType === 'own').length;
      const agencyNum = mockListings.filter(x => x.sourceType !== 'own').length;
      const centalineNum = mockListings.filter(x => x.source === '中原地產').length;
      const midlandNum = mockListings.filter(x => x.source === '美联物业').length;
      const landscapeNum = mockListings.filter(x => x.source === '領域顧問').length;

      const elOwn = document.getElementById("ownCount");
      if (elOwn) elOwn.innerText = ownNum;
      const elAgency = document.getElementById("agencyCount");
      if (elAgency) elAgency.innerText = agencyNum;

      const btnAll = document.querySelector('.source-all');
      if (btnAll) btnAll.innerText = `全部房源 (${totalNum})`;
      const btnOwn = document.querySelector('.source-own');
      if (btnOwn) btnOwn.innerText = `💼 内部自录 (${ownNum})`;
      const btnMidland = document.querySelector('.source-midland');
      if (btnMidland) btnMidland.innerText = `🟡 美联物业 (${midlandNum})`;
      const btnCentaline = document.querySelector('.source-centaline');
      if (btnCentaline) btnCentaline.innerText = `🔴 中原地產 (${centalineNum})`;
      const btnLandscape = document.querySelector('.source-landscape');
      if (btnLandscape) btnLandscape.innerText = `🟣 領域顧問 (${landscapeNum})`;

      let filtered = mockListings.filter(item => {
        if (currentSource !== 'ALL' && item.source !== currentSource) return false;
        if (district !== 'ALL' && item.district !== district) return false;
        if (status !== 'ALL' && item.status !== status) return false;
        if (room !== 'ALL') {
          if (room === '4房及以上') {
            if (!item.layout.includes('4房') && !item.layout.includes('5房') && !item.layout.includes('6房')) return false;
          } else if (!item.layout.includes(room)) return false;
        }
        if (search) {
          const matchStr = (item.estate + item.unit + item.refNo + item.source + item.salesPerson + item.age + item.remarks).toLowerCase();
          if (!matchStr.includes(search)) return false;
        }
        return true;
      });

      if (sort === 'date-desc') {
        filtered.sort((a, b) => (b.confirmDate || '').localeCompare(a.confirmDate || ''));
      } else if (sort === 'price-asc') {
        filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
      } else if (sort === 'price-desc') {
        filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
      } else if (sort === 'psf-desc') {
        filtered.sort((a, b) => (b.psfNum || 0) - (a.psfNum || 0));
      }

      document.getElementById("totalCount").innerText = filtered.length;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state-box">
            <div class="empty-icon">📦</div>
            <div class="empty-title">暂无在盘房源数据</div>
            <div class="empty-desc">
              系统框架已就绪，当前未加载任何二手房源数据。<br/>
              后续在《自有二手房源录入模板.xlsx》或中介 PDF 导入后，将自动在此实时呈现！
            </div>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(item => {
        let badgeClass = "badge-midland";
        let sourceIcon = "🟡";
        if (item.sourceType === 'own') { badgeClass = "badge-own"; sourceIcon = "💼"; }
        if (item.sourceType === 'centaline') { badgeClass = "badge-centaline"; sourceIcon = "🔴"; }
        if (item.sourceType === 'landscape') { badgeClass = "badge-landscape"; sourceIcon = "🟣"; }

        let statusClass = "status-vacant";
        if (item.status === '租中') statusClass = "status-tenanted";
        if (item.status === '自住') statusClass = "status-owner";

        const coverImg = item.photos && item.photos.length > 0 ? item.photos[0] : (item.plan || '');
        const badgeText = item.photos && item.photos.length > 1 ? `📷 ${item.photos.length}张图` : (item.photos && item.photos.length === 1 ? '📷 图' : (item.plan ? '📐 户型' : '无图'));

        html += `
          <div class="card-scheme-b">
            <!-- 缩略图 -->
            <div class="thumb-box" onclick="openGallery('${item.id}')" title="点击查看大图/户型图">
              <img src="${coverImg}" alt="${item.estate}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'72\' height=\'56\' fill=\'%23f1f5f9\'><rect width=\'100%\' height=\'100%\'/><text x=\'50%\' y=\'50%\' font-size=\'10\' fill=\'%2394a3b8\' dominant-baseline=\'middle\' text-anchor=\'middle\'>无图</text></svg>'">
              <span class="thumb-badge">${badgeText}</span>
            </div>

            <!-- 左区：核心房产资产区 (上下两列，大字整齐) -->
            <div class="b-core-zone">
              <div class="b-core-row1">
                <span class="b-district-tag">${item.district}</span>
                <div class="b-prop-name" onclick="openGallery('${item.id}')">${item.estate} · ${item.unit}</div>
                <span class="b-price-hero">HK$ ${item.priceText}</span>
                ${item.rent ? `<span class="b-rent-sub">(租: ${item.rent})</span>` : ''}
              </div>
              <div class="b-core-row2">
                <span class="b-pill-layout">${item.layout}</span>
                <span class="b-pill-area">${item.area.toLocaleString()} 呎</span>
                <span class="b-pill-psf">@${item.psf}</span>
              </div>
            </div>

            <!-- 竖向美学分割线 -->
            <div class="b-divider"></div>

            <!-- 右区：对接与业务跟进区 (上下两列，清晰分类) -->
            <div class="b-detail-zone">
              <div class="b-detail-row1">
                <span class="badge-source ${badgeClass}">${sourceIcon} ${item.source}</span>
                <span class="ref-code">${item.refNo}</span>
                <button class="btn-copy" onclick="copyText('${item.refNo}')">复制</button>
                <span class="badge-age">🏷️ ${item.age}</span>
                <span class="badge-sales">👤 ${item.salesPerson}</span>
              </div>
              <div class="b-detail-row2">
                <span class="badge-key">${item.keyInfo}</span>
                <span>🚗 ${item.carpark}</span>
                <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:240px;" title="${item.remarks}">💬 ${item.remarks}</span>
              </div>
            </div>

            <!-- 最右侧：状态、日期与操作 -->
            <div class="b-action-zone">
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="badge-status ${statusClass}">${item.status}</span>
                <button class="btn-detail" onclick="viewDetails('${item.id}')">详情</button>
              </div>
              <div class="date-fresh">📅 ${item.confirmDate}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function filterBySource(source) {
      currentSource = source;
      document.querySelectorAll('.source-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = event ? event.target : null;
      if (activeBtn) activeBtn.classList.add('active');
      render();
    }

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("districtFilter").value = "ALL";
      document.getElementById("roomFilter").value = "ALL";
      document.getElementById("statusFilter").value = "ALL";
      document.getElementById("sortFilter").value = "date-desc";
      currentSource = 'ALL';
      document.querySelectorAll('.source-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector('.source-all').classList.add('active');
      render();
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt);
      alert("已复制盘源编号: " + txt);
    }

    function openGallery(id) {
      const item = mockListings.find(x => x.id === id);
      if (!item) return;
      currentGalleryItem = item;
      document.getElementById("gTitle").innerText = `${item.estate} ${item.unit}`;
      const photoCountText = item.photos && item.photos.length > 1 ? ` · 共 ${item.photos.length} 页相片 (点击下方切换)` : '';
      document.getElementById("gSubtitle").innerText = `${item.source} · 盘号 ${item.refNo}${photoCountText}`;
      switchGalleryTab('photos');
      document.getElementById("galleryModal").style.display = "flex";
    }

    function switchGalleryTab(tab) {
      if (!currentGalleryItem) return;
      const mainImg = document.getElementById("gMainImg");
      const thumbsBox = document.getElementById("gThumbsContainer");
      const photoList = currentGalleryItem.photos || [];
      if (photoList.length > 0) {
        mainImg.src = photoList[0];
        thumbsBox.innerHTML = photoList.map((src, idx) => `
          <div class="g-thumb ${idx === 0 ? 'active' : ''}" onclick="setGalleryMain('${src}', this)" title="点击切换第 ${idx + 1} 页相片">
            <img src="${src}">
          </div>
        `).join('');
      } else if (currentGalleryItem.plan) {
        mainImg.src = currentGalleryItem.plan;
        thumbsBox.innerHTML = `<div class="g-thumb active"><img src="${currentGalleryItem.plan}"></div>`;
      }
    }

    function setGalleryMain(src, el) {
      document.getElementById("gMainImg").src = src;
      document.querySelectorAll('.g-thumb').forEach(t => t.classList.remove('active'));
      if (el) el.classList.add('active');
    }

    function closeGallery() { document.getElementById("galleryModal").style.display = "none"; }
    function closeModal() { document.getElementById("detailModal").style.display = "none"; }

    function viewDetails(id) {
      const item = mockListings.find(x => x.id === id);
      if (!item) return;
      document.getElementById("modalBody").innerHTML = `
        <h3 style="font-size:17px; margin-bottom:8px;">${item.estate} ${item.unit}</h3>
        <p style="color:#64748b; margin-bottom:12px;">${item.district} · ${item.source} (${item.refNo}) · 楼龄: ${item.age}</p>
        <div style="background:#f8fafc; padding:12px; border-radius:6px; margin-bottom:12px; line-height:1.8;">
          <div>💰 叫价: <strong style="color:#dc2626; font-size:15px;">HK$ ${item.priceText}</strong> (${item.psf})</div>
          <div>📐 面积格局: ${item.area} 呎 · ${item.layout}</div>
          <div>🔑 钥匙看房: <strong>${item.keyInfo}</strong></div>
          <div>🚗 车位: ${item.carpark}</div>
          <div>👤 内部对接销售: <strong>${item.salesPerson}</strong></div>
          <div>📅 最新确认日期: ${item.confirmDate}</div>
        </div>
        <p style="color:#475569; font-size:12.5px; line-height:1.6; margin-bottom:14px;"><strong>详细备注:</strong> ${item.remarks}</p>
        <div style="text-align:right;"><button class="btn-detail" onclick="closeModal()">关闭</button></div>
      `;
      document.getElementById("detailModal").style.display = "flex";
    }

    // 绑定事件
    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("districtFilter").addEventListener("change", render);
    document.getElementById("roomFilter").addEventListener("change", render);
    document.getElementById("statusFilter").addEventListener("change", render);
    document.getElementById("sortFilter").addEventListener("change", render);

    // 初始渲染
    render();
  </script>
</body>
</html>
